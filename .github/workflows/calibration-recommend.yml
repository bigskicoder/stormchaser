# Runs one calibration pass on demand (scripts/calibration-recommend.ts),
# writing new pending rows to calibration_recommendations for admin review.
# Applies nothing: a multiplier changes only when approved at
# /admin/calibration. The nightly historical run and the weekly Vercel cron
# run the same code; this is for running it right after a rule change.
#
# Needs the same repository secret as the historical run: SUPABASE_SERVICE_ROLE_KEY.

name: Calibration recommend

on:
  workflow_dispatch:

concurrency:
  group: calibration-recommend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hfvcwrzjekzrpyerefao.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx tsx scripts/calibration-recommend.ts
