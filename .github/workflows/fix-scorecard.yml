# One-off repair after the live scorecard fix (scripts/fix-scorecard.ts):
# rebuilds live accuracy rows with measured new snow, sets aside pending
# calibration proposals, and makes fresh ones for review in admin.
#
# Needs the repository secret SUPABASE_SERVICE_ROLE_KEY.

name: Fix scorecard and re-propose calibrations

on:
  workflow_dispatch:

concurrency:
  group: calibration-recommend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hfvcwrzjekzrpyerefao.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx tsx scripts/fix-scorecard.ts
