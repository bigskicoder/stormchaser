# Moves forecast runs nothing reads any more out of the forecast_pulls table
# into gzipped files in the private 'forecast-archive' Storage bucket
# (scripts/archive-forecast-pulls.ts, migration 0018). Rows are deleted only
# with mode "archive", and only after their file has been uploaded,
# downloaded again and checked. "dry-run" writes one test file, checks it,
# removes it and changes nothing.
#
# Runs nightly in archive mode (Nick chose "Archive to files" 2026-11-13),
# after the 06:00 UTC historical run starts, so the table stays at about
# the last few days of runs plus 14 days of the newest run per hour.
#
# Needs the repository secret SUPABASE_SERVICE_ROLE_KEY.

name: Archive old forecasts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (test one file, change nothing) or archive (move old runs out and delete them from the table)"
        type: choice
        options: [dry-run, archive]
        default: dry-run
      days:
        description: "Most run dates to process this time (oldest first); blank = all"
        required: false
        default: ""

concurrency:
  group: archive-forecast-pulls
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hfvcwrzjekzrpyerefao.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run
        env:
          MODE: ${{ inputs.mode || 'archive' }}
          DAYS: ${{ inputs.days }}
        run: |
          args=()
          if [ "$MODE" = "archive" ]; then args+=(--delete); fi
          if [ -n "$DAYS" ]; then args+=("--days=$DAYS"); fi
          # Restart after a failure (usually a database statement timeout
          # while it's busy). Safe: rows are only deleted after their file
          # is checked, and a rerun picks up whatever is still there.
          for attempt in 1 2 3 4 5 6; do
            if npx tsx scripts/archive-forecast-pulls.ts "${args[@]}"; then exit 0; fi
            echo "Attempt $attempt failed; retrying in 60 s."
            sleep 60
          done
          exit 1
